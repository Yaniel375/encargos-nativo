name: Android (APK)

on:
  push:
    branches: [main, rediseno-premium, interfaz-referencia, menu-perfil, graficas-escala, fichas-fotos, login-menu-pagos]
    paths: ["core/**", "android/**", "tests/android_tour.py", "*.kts", "gradle.properties", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pruebas de compatibilidad del motor (core)
        run: |
          set -o pipefail
          gradle --no-daemon :core:vectors :core:funcional 2>&1 | tee core.log || { grep -E "^e: |FAIL|❌|What went wrong" -A2 core.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Preparar firma (clave cifrada del repositorio + contraseña en secreto de GitHub)
        env:
          SIGN_KEY: ${{ secrets.ENCARGOS_SIGN_KEY }}
        run: |
          if [ -n "$SIGN_KEY" ]; then
            printf '%s' "$SIGN_KEY" > "$RUNNER_TEMP/k"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/signing/nativo.keystore.enc -out "$RUNNER_TEMP/encargos.keystore" -pass file:"$RUNNER_TEMP/k"
            rm -f "$RUNNER_TEMP/k"
            echo "ENCARGOS_KEYSTORE=$RUNNER_TEMP/encargos.keystore" >> "$GITHUB_ENV"
            echo "::add-mask::$SIGN_KEY"
            echo "ENCARGOS_KEYSTORE_PASSWORD=$SIGN_KEY" >> "$GITHUB_ENV"
            echo "ENCARGOS_KEY_ALIAS=encargos" >> "$GITHUB_ENV"
            echo "::notice title=Firma::APK firmado con la clave propia de Encargos nativo"
          else
            echo "::warning title=Firma::Falta el secreto ENCARGOS_SIGN_KEY: el APK usa una clave de prueba (para actualizar habrá que desinstalar antes)."
          fi

      - name: Compilar APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee build.log || {
            grep -E "^e: |error:|FAILURE|What went wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            mkdir -p reg && cp build.log reg/android_build.log && cd reg && git init -q -b registros-android && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm log && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" registros-android
            exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Encargos-Android
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publicar en la página de descargas (Releases)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pub && cp android/build/outputs/apk/release/*.apk "pub/Encargos-Android.apk"
          echo "::notice title=Archivo listo::Encargos-Android.apk $(du -h pub/Encargos-Android.apk | cut -f1)"
          for i in 1 2 3; do
            gh release view ultima >/dev/null 2>&1 || gh release create ultima --title "Encargos nativo · última versión" --notes "Descargas de Encargos nativo. Android: Encargos-Android.apk · Windows: Encargos_Windows_Setup.exe. No contienen ningún token: el bot se configura dentro de la app." --latest || true
            gh release upload ultima "pub/Encargos-Android.apk" --clobber && break
            sleep 10
          done

      - name: Compilar copia de PRUEBA (permite capturas; no se publica)
        env:
          ENCARGOS_CAPTURE_TEST: "1"
        run: gradle --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Encargos-Android-prueba
          path: android/build/outputs/apk/release/*.apk
          retention-days: 3

      - name: Borrar la clave del disco del servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/encargos.keystore"

  prueba-en-vivo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Encargos-Android-prueba, path: apk }
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Recorrer la app en un teléfono emulado (datos de prueba)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            python3 tests/android_tour.py shots || echo FALLO > shots/FALLO
      - name: Resultado
        run: |
          cat shots/recorrido.txt
          if [ -f shots/FALLO ]; then echo "::error title=Android::$(tail -1 shots/recorrido.txt) $(head -c 500 shots/crash.txt | tr '\n' ' ')"; else echo "::notice title=Android::$(tail -1 shots/recorrido.txt)"; fi
          grep -c "✗" shots/recorrido.txt | xargs -I{} echo "::notice title=Pasos no encontrados::{}"
      - name: Guardar capturas en la rama capturas-android
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd shots && git init -q -b capturas-android && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "Capturas Android run ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" capturas-android
      - name: Fallar si la app se cerró
        run: test ! -f shots/FALLO
