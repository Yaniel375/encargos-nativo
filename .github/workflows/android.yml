name: Android (APK)

on:
  push:
    branches: [main]
    paths: ["core/**", "android/**", "*.kts", "gradle.properties", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pruebas de compatibilidad del motor (core)
        run: gradle --no-daemon :core:vectors

      - name: Preparar firma (desde secretos de GitHub, nunca en el repositorio)
        env:
          KS_B64: ${{ secrets.ENCARGOS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/encargos.keystore"
            echo "ENCARGOS_KEYSTORE=$RUNNER_TEMP/encargos.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secreto ENCARGOS_KEYSTORE_B64: el APK se firmará con una clave de prueba."
          fi

      - name: Compilar APK
        env:
          ENCARGOS_KEYSTORE_PASSWORD: ${{ secrets.ENCARGOS_KEYSTORE_PASSWORD }}
          ENCARGOS_KEY_ALIAS: ${{ secrets.ENCARGOS_KEY_ALIAS }}
          ENCARGOS_KEY_PASSWORD: ${{ secrets.ENCARGOS_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Borrar la clave del disco del servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/encargos.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: Encargos-Android
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publicar en la página de descargas (Releases)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pub && cp android/build/outputs/apk/release/*.apk "pub/Encargos-Android.apk"
          echo "::notice title=Archivo listo::Encargos-Android.apk $(du -h pub/Encargos-Android.apk | cut -f1)"
          for i in 1 2 3; do
            gh release view ultima >/dev/null 2>&1 || gh release create ultima --title "Encargos nativo · última versión" --notes "Descargas de Encargos nativo. Android: Encargos-Android.apk · Windows: Encargos_Windows_Setup.exe. No contienen ningún token: el bot se configura dentro de la app." --latest || true
            gh release upload ultima "pub/Encargos-Android.apk" --clobber && break
            sleep 10
          done

  prueba-en-vivo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Encargos-Android, path: apk }
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Abrir la app en un teléfono emulado y capturar pantallas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p shots && adb logcat -c && adb install -r apk/*.apk && adb shell am start -W -n com.agencia.encargos.nativo/.MainActivity ; sleep 12 ; adb exec-out screencap -p > shots/android_1_inicio.png ; adb shell input tap 540 1500 ; sleep 3 ; adb exec-out screencap -p > shots/android_2.png ; adb logcat -d > shots/logcat.txt ; adb shell pidof com.agencia.encargos.nativo > shots/pid.txt || echo "NO" > shots/pid.txt
      - name: Revisar cierres inesperados
        run: |
          grep -A40 "FATAL EXCEPTION" shots/logcat.txt | grep -v "^--$" > shots/crash.txt || true
          grep -E "com.agencia.encargos|AndroidRuntime" shots/logcat.txt | tail -300 > shots/app_log.txt || true
          rm -f shots/logcat.txt
          if [ -s shots/crash.txt ]; then echo "::error title=La app se cerró::$(head -c 600 shots/crash.txt | tr '\n' ' ')"; else echo "::notice title=Android::La app abrió sin cerrarse (pid $(cat shots/pid.txt))"; fi
      - name: Guardar capturas en la rama capturas-android
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd shots && git init -q -b capturas-android && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "Capturas Android run ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" capturas-android
