name: Windows (instalador)

on:
  push:
    branches: [main, rediseno-premium, interfaz-referencia, menu-perfil, pc-sync, anillos]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pruebas del núcleo C#
        run: |
          dotnet run --project windows/Encargos.Tests -c Release -- vectors
          dotnet run --project windows/Encargos.Tests -c Release -- funcional

      - name: Compilar la app (WinUI 3, autocontenida x64)
        shell: bash
        run: |
          set -o pipefail
          dotnet publish windows/Encargos.Win/Encargos.Win.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out/app 2>&1 | tee build.log || {
            grep -E "error [A-Z]+[0-9]+" build.log | sed 's/^.*Encargos.Win[\\/]//' | sort -u | head -50 | while IFS= read -r l; do echo "::error::$l"; done
            mkdir -p reg && cp build.log reg/windows_build.log && cd reg && git init -q -b registros-windows && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm log && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" registros-windows
            exit 1; }

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear instalador
        shell: pwsh
        run: |
          $env:ENCARGOS_VERSION = "1.0.${{ github.run_number }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Encargos-Windows
          path: out/Encargos_Windows_Setup_*.exe
          if-no-files-found: error

      - name: Publicar en la página de descargas (Releases)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pub && cp out/Encargos_Windows_Setup_*.exe "pub/Encargos_Windows_Setup.exe"
          echo "::notice title=Archivo listo::Encargos_Windows_Setup.exe $(du -h pub/Encargos_Windows_Setup.exe | cut -f1)"
          for i in 1 2 3; do
            gh release view ultima >/dev/null 2>&1 || gh release create ultima --title "Encargos nativo · última versión" --notes "Descargas de Encargos nativo. Android: Encargos-Android.apk · Windows: Encargos_Windows_Setup.exe. No contienen ningún token: el bot se configura dentro de la app." --latest || true
            gh release upload ultima "pub/Encargos_Windows_Setup.exe" --clobber && break
            sleep 10
          done

  prueba-en-vivo:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Encargos-Windows, path: setup }
      - name: Instalar la app
        shell: pwsh
        run: |
          $s = Get-ChildItem setup\*.exe | Select-Object -First 1
          Start-Process $s.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (!(Test-Path "$env:LOCALAPPDATA\Programs\Encargos Nativo\Encargos.exe")) { "::error::No se instaló Encargos.exe"; exit 1 }
          Get-Process Encargos -ErrorAction SilentlyContinue | Stop-Process -Force
          (New-Object -ComObject Shell.Application).MinimizeAll()
      - name: Autoprueba de la app (carpeta de datos aparte, datos de prueba)
        shell: pwsh
        run: |
          $dir = "$PWD\shots"; New-Item -ItemType Directory -Force $dir | Out-Null
          $env:ENCARGOS_SELFTEST = $dir
          $p = Start-Process "$env:LOCALAPPDATA\Programs\Encargos Nativo\Encargos.exe" -PassThru
          if (!$p.WaitForExit(180000)) { "::error title=Windows::La autoprueba no terminó en 3 minutos"; Stop-Process $p -Force; "FALLO" | Out-File "$dir\FALLO" }
          $log = "$dir\datos\errores.log"; if (Test-Path $log) { Copy-Item $log "$dir\errores.log" }
          Remove-Item -Recurse -Force "$dir\datos" -ErrorAction SilentlyContinue
          if (!(Test-Path "$dir\autoprueba.txt")) { "::error title=Windows::La app se cerró antes de terminar (código $($p.ExitCode))"; "FALLO" | Out-File "$dir\FALLO"; exit 0 }
          Get-Content "$dir\autoprueba.txt"
          $last = (Get-Content "$dir\autoprueba.txt" | Select-String "RESULTADO" | Select-Object -Last 1)
          if ("$last" -notmatch "RESULTADO: OK") { "::error title=Windows::$last"; "FALLO" | Out-File "$dir\FALLO" } else { "::notice title=Windows::$last" }
          Get-Content "$dir\autoprueba.txt" | Select-String "ERROR|falló" | ForEach-Object { "::warning title=Windows::$_" }
          exit 0
      - name: Guardar capturas en la rama capturas-windows
        if: always()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd shots && git init -q -b capturas-windows && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "Capturas Windows run ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" capturas-windows
      - name: Fallar si la app se cerró
        shell: bash
        run: test ! -f shots/FALLO
